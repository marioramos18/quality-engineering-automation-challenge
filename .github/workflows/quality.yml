name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        id: install
        run: uv sync --locked --dev
      - name: Ruff
        run: uv run --locked ruff check api
      - name: Pytest regression
        run: |
          mkdir -p reports/api-regression
          set -o pipefail
          uv run --locked --env-file .env.example pytest api/tests -m "not quality_finding" -v \
            --html=reports/api-regression/report.html --self-contained-html \
            --junitxml=reports/api-regression/junit.xml \
            2>&1 | tee reports/api-regression/pytest.log
      - name: Pytest known finding API-001
        id: api_finding
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p reports/api-quality-findings
          set -o pipefail
          uv run --locked --env-file .env.example pytest \
            api/tests/test_required_fields_negative.py::test_post_rejects_missing_firstname \
            -m quality_finding -v \
            --html=reports/api-quality-findings/report.html --self-contained-html \
            --junitxml=reports/api-quality-findings/junit.xml \
            2>&1 | tee reports/api-quality-findings/pytest.log
      - name: Summarize API finding
        if: always()
        run: |
          printf '### API-001 — diagnóstico separado\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Resultado original da etapa Pytest: **%s**.\n' \
            '${{ steps.api_finding.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'Um resultado failure indica que o teste continua FAILED; a etapa não integra a regressão aprovada.\n' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-reports
          path: |
            reports/api-regression/
            reports/api-quality-findings/
          if-no-files-found: warn

  e2e-safe:
    name: E2E Safe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build existing E2E image
        run: docker build -t quality-challenge-e2e:ci web
      - name: Run safe checkout scenarios
        run: |
          mkdir -p reports
          set -o pipefail
          docker run --rm --ipc=host \
            -v "$PWD/reports:/workspace/reports" \
            quality-challenge-e2e:ci \
            npm test -- --tags @checkout-safe \
            2>&1 | tee reports/e2e-safe.log
      - name: Upload E2E safe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-safe-reports
          path: |
            reports/e2e-report.html
            reports/e2e-safe.log
            reports/catalog-diagnostics/
          if-no-files-found: warn
