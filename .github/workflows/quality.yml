name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-python:
    name: Python guards (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Isolation guards without Docker
        run: uv run --locked pytest tests -v --junitxml=reports/portable/junit.xml
      - name: API runner entrypoint
        run: python scripts/run_api.py --help
      - name: E2E runner entrypoint
        run: python scripts/run_e2e.py --help
      - name: Load runner entrypoint
        run: python scripts/run_load.py --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-guards-${{ matrix.os }}
          path: reports/portable/
          if-no-files-found: warn

  api-tests:
    name: API Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        id: install
        run: uv sync --locked --dev
      - name: Ruff
        run: uv run --locked ruff check api scripts tests
      - name: API isolation guards
        run: uv run --locked pytest tests -v --junitxml=reports/api-guards/junit.xml
      - name: Pytest regression
        run: python scripts/run_api.py
      - name: Pytest known finding API-001
        id: api_finding
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/run_api.py --finding
      - name: Summarize API finding
        if: always()
        env:
          FINDING_OUTCOME: ${{ steps.api_finding.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('reports/api-quality-findings/junit.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('### API-001 — diagnóstico separado\n\n')
              output.write(f"Resultado original da etapa: **{os.environ['FINDING_OUTCOME']}**.\n")
              if report.exists():
                  suites = list(ET.parse(report).getroot().iter('testsuite'))
                  totals = {key: sum(int(s.get(key, 0)) for s in suites)
                            for key in ('tests', 'failures', 'errors', 'skipped')}
                  output.write(f"JUnit: {totals}.\n")
                  output.write('Consulte a assertion no relatório para distinguir divergência de contrato de erro ambiental.\n')
              else:
                  output.write('JUnit ausente: teste não comprovado; inspecione instalação e logs do serviço.\n')
              output.write('Diagnóstico não integra a regressão aprovada.\n')
          PY
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-reports
          path: |
            reports/api-regression/
            reports/api-quality-findings/
            reports/api-guards/
          if-no-files-found: warn

  e2e:
    name: E2E isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete suite, isolation guards and TypeScript checks
        run: python scripts/run_e2e.py
      - name: Summarize E2E results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('reports/e2e-isolated/junit.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### E2E isolated\n\n')
              if report.exists():
                  suites = list(ET.parse(report).getroot().iter('testsuite'))
                  totals = {key: sum(int(s.get(key, 0)) for s in suites)
                            for key in ('tests', 'failures', 'errors', 'skipped')}
                  output.write(f"Scenarios: {totals['tests']}; failures: {totals['failures']}; "
                               f"errors: {totals['errors']}; skipped: {totals['skipped']}.\n")
              else:
                  output.write('JUnit was not generated. Inspect setup logs and services.log.\n')
          PY
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-isolated-reports
          path: reports/e2e-isolated/
          if-no-files-found: warn
