name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        id: install
        run: uv sync --locked --dev
      - name: Ruff
        run: uv run --locked ruff check api
      - name: Pytest regression
        run: |
          mkdir -p reports/api-regression
          set -o pipefail
          uv run --locked --env-file .env.example pytest api/tests -m "not quality_finding" -v \
            --html=reports/api-regression/report.html --self-contained-html \
            --junitxml=reports/api-regression/junit.xml \
            2>&1 | tee reports/api-regression/pytest.log
      - name: Pytest known finding API-001
        id: api_finding
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p reports/api-quality-findings
          set -o pipefail
          uv run --locked --env-file .env.example pytest \
            api/tests/test_required_fields_negative.py::test_post_rejects_missing_firstname \
            -m quality_finding -v \
            --html=reports/api-quality-findings/report.html --self-contained-html \
            --junitxml=reports/api-quality-findings/junit.xml \
            2>&1 | tee reports/api-quality-findings/pytest.log
      - name: Summarize API finding
        if: always()
        run: |
          printf '### API-001 — diagnóstico separado\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Resultado original da etapa Pytest: **%s**.\n' \
            '${{ steps.api_finding.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'Um resultado failure indica que o teste continua FAILED; a etapa não integra a regressão aprovada.\n' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-reports
          path: |
            reports/api-regression/
            reports/api-quality-findings/
          if-no-files-found: warn

  e2e:
    name: E2E isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete suite, isolation guards and TypeScript checks
        run: python scripts/run_e2e.py
      - name: Summarize E2E results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('reports/e2e-isolated/junit.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### E2E isolated\n\n')
              if report.exists():
                  suites = list(ET.parse(report).getroot().iter('testsuite'))
                  totals = {key: sum(int(s.get(key, 0)) for s in suites)
                            for key in ('tests', 'failures', 'errors', 'skipped')}
                  output.write(f"Scenarios: {totals['tests']}; failures: {totals['failures']}; "
                               f"errors: {totals['errors']}; skipped: {totals['skipped']}.\n")
              else:
                  output.write('JUnit was not generated. Inspect setup logs and services.log.\n')
          PY
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-isolated-reports
          path: reports/e2e-isolated/
          if-no-files-found: warn
