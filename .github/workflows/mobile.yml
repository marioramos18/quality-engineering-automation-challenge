name: Mobile Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-poc:
    name: Android Appium tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APK_PATH: /tmp/android.wdio.native.app.v2.2.0.apk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked mobile Python dependencies
        run: uv sync --locked --only-group mobile

      - name: Install Appium 3.7.0 and UiAutomator2 8.7.0
        run: |
          npm install --global appium@3.7.0 --no-audit --no-fund
          appium driver install uiautomator2@8.7.0
          appium --version
          appium driver list --installed

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle

      - name: Check KVM access
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable on this runner; the Android emulator needs KVM acceleration."
            exit 1
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm exists but is not readable and writable by this runner."
            exit 1
          fi
          ls -l /dev/kvm

      - name: Download and verify official Android APK v2.2.0
        run: |
          curl --fail --location --show-error --silent \
            --connect-timeout 15 --max-time 300 \
            --output "$APK_PATH" \
            https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk
          printf '%s  %s\n' \
            'fe1d605ce099c73d93f33e5cbcb0df0bea437ce57aaaaf156b3b0fa1ca54931d' \
            "$APK_PATH" | sha256sum --check --status
          echo 'Official APK SHA-256 verified.'

      - name: Boot emulator and verify app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/mobile-ci.sh

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-poc
          path: reports/mobile/
          if-no-files-found: warn
