services:
  mock-api:
    build: ./mock-api
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - isolated

  k6:
    image: grafana/k6:1.5.0
    entrypoint: ["k6", "run"]
    command: ["/scripts/load-test.js"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      K6_NO_USAGE_REPORT: "true"
      LOAD_VUS: "${LOAD_VUS:-500}"
      LOAD_DURATION: "${LOAD_DURATION:-5m}"
      RUN_PROFILE: "${RUN_PROFILE:-load}"
    volumes:
      - ./load-test.js:/scripts/load-test.js:ro
      - ../reports/performance:/results
    networks:
      - isolated

networks:
  isolated:
    internal: true
