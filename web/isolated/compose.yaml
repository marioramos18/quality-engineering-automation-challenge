# Private test environment. No application source is vendored or published.
services:
  database:
    image: mariadb:10.6@sha256:88ac718dafee1e8fb415233c04f314f3c3866af99177ce25d436106c62090461
    environment:
      MARIADB_ROOT_PASSWORD: local-root-only
      MARIADB_DATABASE: toolshop
      MARIADB_USER: toolshop
      MARIADB_PASSWORD: local-test-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [isolated]

  api:
    image: testsmith/practice-software-testing-sprint5-api@sha256:881cb7ecd76477994728648c0c16f6e9d2beed0f0217734843a32a7bb92553f0
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: toolshop
      DB_USERNAME: toolshop
      DB_PASSWORD: local-test-only
      MAIL_MAILER: log
      MAIL_DRIVER: log
    volumes:
      - application:/var/www
    depends_on:
      database:
        condition: service_healthy
    networks: [isolated]

  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    volumes:
      - application:/var/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [isolated]

  ui:
    image: testsmith/practice-software-testing-sprint5-ui@sha256:f907d8daae32dc90ba900e964928d00bf0aabfab7067eaeeaa49f5a0f70c52e6
    command: [node_modules/.bin/ng, serve, --host, 0.0.0.0, --port, "4200"]
    # UI, API HTTP listener and browser share loopback. This preserves the
    # application's development API URL and the negative-auth request guard.
    network_mode: service:gateway
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  tests:
    build: ..
    network_mode: service:gateway
    shm_size: 1gb
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      WEB_BASE_URL: http://localhost:4200
      E2E_ALLOW_NEGATIVE_AUTH: "1"
      E2E_ALLOW_ORDER_CREATION: "1"
      E2E_CUSTOMER_EMAIL: customer@practicesoftwaretesting.com
      E2E_CUSTOMER_PASSWORD: welcome01
      E2E_AUDIT_EMAIL: admin@practicesoftwaretesting.com
      E2E_AUDIT_PASSWORD: welcome01
      E2E_API_BASE_URL: http://localhost:8091
      E2E_REPORT_DIR: ../reports/e2e-isolated
      E2E_CAPTURE_SUCCESS: "1"
    volumes:
      - ../../reports:/workspace/reports
    command: [npm, test]

networks:
  isolated:
    internal: true

volumes:
  application:
